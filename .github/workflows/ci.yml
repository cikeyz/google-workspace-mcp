name: ci

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python
        run: python -m compileall -q server.py setup
      - name: No trailing whitespace
        run: git diff --check
      - name: No secret patterns
        run: >
          ! grep -rEn "GOCSPX-|AIza[0-9A-Za-z_-]{10,}|ya29\.|4/0[A-Za-z0-9_-]{10,}|xox[bap]-" .
          --exclude-dir=.git --exclude-dir=__pycache__
